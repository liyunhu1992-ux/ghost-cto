<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Background Frame -->
  <rect x="0" y="0" width="980" height="430" rx="18" fill="#F8F7F4" stroke="#E5E4DF" stroke-width="2"/>

  <!-- Header -->
  <text x="490" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#18181B">GhostCTO（影子 CTO）：带零基础小白在聊天框从 0 到 5 免费做出真软件</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#64646E">100% 免费开源 · 不用背提示词 · 支持自用网页 / 多账号商用系统 / 微信小程序双端</text>

  <!-- ==================== COLUMN 1: STEP 0 -> 1 ==================== -->
  <rect x="28" y="88" width="292" height="278" rx="14" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
  <rect x="46" y="106" width="164" height="26" rx="13" fill="#18181B"/>
  <text x="128" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">第 0→1 步 · 定性反问与铺底座</text>

  <!-- User Chat Bubble -->
  <rect x="46" y="144" width="256" height="42" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="58" y="162" font-size="11.5" font-weight="700" fill="#1D4ED8">小白只说一句零碎大白话：</text>
  <text x="58" y="179" font-size="12" fill="#1E3A8A">“我想做个宠物洗护会员预约小程序”</text>

  <!-- AI Coach Reply -->
  <rect x="46" y="196" width="256" height="90" rx="10" fill="#F8F7F4" stroke="#E5E4DF"/>
  <text x="58" y="215" font-size="11.5" font-weight="700" fill="#18181B">🛡️ 影子 CTO 自动拦贪多 &amp; 问选择题：</text>
  <text x="58" y="234" font-size="11.2" fill="#3F3F46">• A. 个人电脑/手机网页版（免登录秒开）</text>
  <text x="58" y="252" font-size="11.2" fill="#3F3F46">• B. 商用多账号版（scrypt加密+员工分权）</text>
  <text x="58" y="270" font-size="11.2" fill="#3F3F46">• C. 微信小程序 + 后台双端（免费预览）</text>

  <!-- Step 1 Result -->
  <rect x="46" y="296" width="256" height="54" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="58" y="316" font-size="11.5" font-weight="700" fill="#065F46">✅ 1秒生成 SQLite 真落库全栈底座</text>
  <text x="58" y="335" font-size="11" fill="#047857">自带防连击 · 防误删二次确认 · 导出 Excel</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="320" y1="227" x2="344" y2="227" stroke="#18181B" stroke-width="2"/>
  <polygon points="344,227 336,222 336,232" fill="#18181B"/>

  <!-- ==================== COLUMN 2: STEP 2 -> 4 ==================== -->
  <rect x="344" y="88" width="292" height="278" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="362" y="106" width="174" height="26" rx="13" fill="#2563EB"/>
  <text x="449" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">第 2→4 步 · 无损改表与后悔药</text>

  <!-- Guard 1 -->
  <rect x="362" y="144" width="256" height="64" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="374" y="164" font-size="12" font-weight="700" fill="#18181B">1. SQLite 自动无损加列 &amp; 锁范围</text>
  <text x="374" y="182" font-size="11.2" fill="#52525B">二次加新字段自动升级老数据库不丢数据；</text>
  <text x="374" y="198" font-size="11.2" fill="#52525B">问“为什么”0修改，改按钮锁死 &lt;=3 个文件</text>

  <!-- Guard 2 -->
  <rect x="362" y="218" width="256" height="68" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="374" y="238" font-size="12" font-weight="700" fill="#92400E">2. 代码 + SQLite(WAL) 双轨时光机</text>
  <text x="374" y="257" font-size="11.2" fill="#78350F">改崩了只发一句“退回刚才”，连代码带</text>
  <text x="374" y="274" font-size="11.2" fill="#78350F">测试客户数据 1 秒原子恢复，绝不重开！</text>

  <!-- Guard 3 -->
  <rect x="362" y="296" width="256" height="54" rx="10" fill="#F4F4F5" stroke="#D4D4D8"/>
  <text x="374" y="316" font-size="11.5" font-weight="700" fill="#18181B">3. 启动前预检 + IDE Stop Hook 拦截</text>
  <text x="374" y="335" font-size="11" fill="#52525B">就算 AI 忘跑检查，钩子与启动器也会自动拦住</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="636" y1="227" x2="660" y2="227" stroke="#18181B" stroke-width="2"/>
  <polygon points="660,227 652,222 652,232" fill="#18181B"/>

  <!-- ==================== COLUMN 3: STEP 5 ==================== -->
  <rect x="660" y="88" width="292" height="278" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <rect x="678" y="106" width="168" height="26" rx="13" fill="#059669"/>
  <text x="762" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">第 5 步 · 硬门禁验真与成熟交付</text>

  <!-- Score Pill -->
  <rect x="854" y="104" width="80" height="30" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="894" y="124" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">100 / 100</text>

  <!-- Gate Checklist -->
  <rect x="678" y="144" width="256" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="690" y="164" font-size="12" font-weight="700" fill="#18181B">0-Token 本地编译器级门禁 (verify)：</text>
  <text x="690" y="185" font-size="11.2" fill="#065F46">✔ 拦截 JS / HTML 脚本 / 小程序配置语法错</text>
  <text x="690" y="205" font-size="11.2" fill="#065F46">✔ 拦截未安装的外部包 / 缺失导出 / SQL 错列</text>
  <text x="690" y="225" font-size="11.2" fill="#065F46">✔ 拦截空点击假按钮 &amp; 不连后端的假保存</text>
  <text x="690" y="245" font-size="11.2" fill="#065F46">✔ 拦截 404 断头接口 / 空 catch / 明文密码</text>
  <text x="690" y="265" font-size="11.2" fill="#065F46">✔ Git 提交自动拦截 .env 与云密钥外泄</text>

  <!-- Final Delivery -->
  <rect x="678" y="296" width="256" height="54" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="690" y="316" font-size="11.5" font-weight="700" fill="#065F46">🚀 交付真正能用的免费产品</text>
  <text x="690" y="335" font-size="11" fill="#047857">《双击启动项目》即用 ｜ 商用Docker ｜ 小程序包</text>

  <!-- Bottom Compatibility Bar -->
  <rect x="28" y="380" width="924" height="34" rx="9" fill="#18181B"/>
  <text x="490" y="402" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FFFFFF">零第三方依赖 (Pure Node.js &gt;= 18) · 同源适配：豆包 / 字节 Trae / 腾讯 WorkBuddy / CodeBuddy / Antigravity / Cursor / Claude Code / Windsurf</text>
</svg>
